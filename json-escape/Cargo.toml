[package]
name = "simd-json-escape"
version = "0.1.0"
edition = "2021"

# json-escape-simd reimplemented in simd-lang (json_escape.simd), tested
# against the real crate and serde_json and benchmarked head to head. Links the
# AOT-compiled static library only: no MLIR or LLVM here. Regenerate it with
#   ./json-escape/build-kernel.sh

[lib]
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
json-escape-simd = "=3.1.3"
libc = "0.2"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace]
